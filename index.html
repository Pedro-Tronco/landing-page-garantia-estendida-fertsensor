<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fert Sensor - Programa de Garantia</title>
    <link rel="icon" type="image/png" href="https://img.fertisystem.com.br/Icone_FertiSystem_PB-Negativo.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+1:wght@100..900&family=Nunito+Sans:ital,opsz,wght@0,6..12,200..1000;1,6..12,200..1000&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/mustache@4.2.0/mustache.js"></script>
</head>

<body>
    <noscript>
        <div style="background:#FF6A3933;color:#1a1a1a;padding:16px;border:1px solid #FF6A39;text-align:center;font-size:17px;font-family:Arial, sans-serif;">
            <strong>JavaScript necessário:</strong> Este site requer JavaScript para funcionar corretamente. Por favor, ative o JavaScript no seu navegador seguindo os passos abaixo.
            <div style="margin-top:8px;text-align:left;max-width:900px;margin-left:auto;margin-right:auto;">
                <ol style="margin:8px 0;padding-left:20px;">
                    <li style="margin: 8px 0;"><strong>Chrome (Windows/macOS):</strong> Menu → Configurações → Privacidade e segurança → Configurações do site → JavaScript → Ativar.</li>
                    <li style="margin: 8px 0;"><strong>Edge (Windows/macOS):</strong> Menu → Definições → Cookies e permissões do site → JavaScript → Ativar.</li>
                    <li style="margin: 8px 0;"><strong>Firefox (Windows/macOS):</strong> Na barra de endereço digite <code>about:config</code>, procure por <code>javascript.enabled</code> e defina como <code>true</code>. (Alternativamente, verifique as configurações de conteúdo.)</li>
                    <li style="margin: 8px 0;"><strong>Safari (macOS):</strong> Safari → Preferências → Segurança → Marcar "Ativar JavaScript".</li>
                </ol>
            </div>
        </div>
    </noscript>
    <nav class="navbar">
        <a href="#hero-target" class="nav-logo">
            <img src="https://img.fertisystem.com.br/Marca_FertiSystem_PB-Negativo.png" alt="FertiSystem">
        </a>

        <script id="nav-buttons-template" type="text/template">
            {{#nav.index}}
                {{#displayButtons}}
                    {{#buttons}}
                        <a href="{{navigation}}">{{name}}</a>
                    {{/buttons}}
                {{/displayButtons}}
            {{/nav.index}}
        </script>
        <div id="nav-buttons-target" class="nav-buttons"></div>

        <div class="lang-dropdown">
            <script id="lang-toggle-template" type="text/template">
                {{#languages}}
                    <option value="{{code}}">{{label}}</option>
                {{/languages}}
            </script>
            <select id="lang-toggle" class="lang-selection"></select>
        </div>
    </nav>

    <main>
        <section class="hero">
            <script id="hero-template" type="text/template">
                <div class="hero-container">
                    <div class="hero-left">
                        <div class="hero-badge"><ul><li>{{hero.badge}}</li></ul></div>
                        <div class="hero-title">
                            <h1>{{{hero.title}}}</h1>
                            <p>{{hero.subtitle}}</p>
                        </div>
                        <div class="hero-cards">
                            {{#hero.cards}}
                            <div class="hero-card" style="background-color: {{backgroundColor}}33; color: {{fontColor}}; border: 0.5px solid {{fontColor}};">
                                <h1>{{title}}</h1>
                                <h2>{{number}}</h2>
                                <p>{{unit}}</p>
                            </div>
                            {{^last}}
                            <div class="hero-card-separator">+</div>
                            {{/last}}
                            {{/hero.cards}}
                        </div>
                        <div class="hero-observation">
                            <h1>{{hero.observation.symbol}}</h1>
                            <p><strong>{{hero.observation.title}}</strong> {{hero.observation.description}}</p>
                        </div>
                    </div>
                    <div class="hero-right">
                        <div class="hero-form">
                            <h1>{{hero.form.title}}</h1>
                            <h2>{{hero.form.subtitle}}</h2>
                            <ul>
                                {{#hero.form.fields}}
                                <li>{{label}}</li>
                                {{/hero.form.fields}}
                            </ul>
                            <form action="warranty.html">
                                <button type="button" id="open-login-popup">{{hero.form.buttonLabel}}</button>
                            </form>
                            {{#hero.form.note}}
                                <p class="hero-form-observation">{{description}}</p>
                            {{/hero.form.note}}
                        </div>
                        <div>
                            <a href="#install-header-target" class="hero-scroll-hint">
                                <p>{{hero.scrollHintLabel}}</p>
                                <svg class="down-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M19 9l-7 7-7-7"></path>
                                </svg>
                            </a>
                        </div>
                    </div>
                </div>
            </script>
            <div id="hero-target" class="hero-content"></div>
        </section>

        <header>
            <script id="install-header-template" type="text/template">
                <h2>{{install-header.subtitle}}</h2>
                <h1>{{install-header.title}}</h1>
                <p>{{install-header.description}}</p>
                {{#install-header.observation}}
                    <ul>
                        <li><strong>{{install-header.observation.title}}</strong> {{{install-header.observation.description}}}</li>
                    </ul>
                {{/install-header.observation}}
            </script>
            <div id="install-header-target" class="install-header content-header"></div>
        </header>
        <section>
            <script id="install-template" type="text/template">
                {{#install-section}}
                    <h1>{{title}}</h1>
                    <article class="install-article">
                        <div class="install-content">
                            <p class="install-description">{{{description}}}</p>
                            <ul>
                                {{#steps}}
                                <li>{{{description}}}</li>
                                {{/steps}}
                            </ul>
                            <div class="install-observation">
                                <strong>{{observation.title}}</strong> {{{observation.description}}}
                            </div>
                        </div>
                        <div class="install-video">
                            <iframe 
                                src="{{videoUrl}}" 
                                title="{{title}}"
                                frameborder="0" 
                                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; web-share" 
                                referrerpolicy="strict-origin-when-cross-origin" 
                                allowfullscreen>
                            </iframe>
                        </div>
                    </article>
                    <hr>
                    {{/install-section}}
                </script>
                <div id="install-target" class="install-section"></div>
            </section>
            

        <header>
            <script id="faq-header-template" type="text/template">
                <h2>{{faq-header.subtitle}}</h2>
                <h1>{{faq-header.title}}</h1>
                <p>{{faq-header.description}}</p>
                {{#faq-header.observation}}
                    <ul>
                        <li><strong>{{faq-header.observation.title}}</strong> {{{faq-header.observation.description}}}</li>
                    </ul>
                {{/faq-header.observation}}
            </script>
            <div id="faq-header-target" class="faq-header content-header"></div>
        </header>
        <section>
            <div class="faq-container">
                <script id="faq-categories-template" type="text/template">
                    {{#faq-section.categories}}
                        <button class="faq-category-btn" data-category-id="{{id}}">{{name}}</button>
                    {{/faq-section.categories}}
                </script>
                <div class="faq-categories-wrapper">
                    <div id="faq-categories-target" class="faq-categories-carousel carousel-fade-edges"></div>
                </div>

                <script id="faq-questions-template" type="text/template">
                    <div class="faq-questions-container">
                        {{#questions}}
                            <div class="faq-question-item">
                                <button class="faq-question-btn">
                                    <span class="faq-question-text">{{question}}</span>
                                    <span class="faq-question-toggle">+</span>
                                </button>
                                <div class="faq-answer" style="display: none;">
                                    <p>{{{answer}}}</p>
                                </div>
                            </div>
                        {{/questions}}
                    </div>
                </script>
                <div id="faq-questions-target"></div>
            </div>
        </section>

        <section>
            <script id="form-reminder-template" type="text/template">
                <div class="form-reminder">
                    <h1>{{form-reminder.title}}</h1>
                    <p>{{form-reminder.subtitle}}</p>
                    <button id="open-login-popup-reminder">{{form-reminder.buttonLabel}}</button>
                </div>
            </script>
            <div id="form-reminder-target" class="form-reminder-section"></div>
        </section>

    </main>

    <footer>
        <script id="footer-template" type="text/template">
            <div class="footer-container">
                <nav class="footer-docs carousel-fade-edges">
                    {{#footer.docsButtons}}
                        <a href="{{url}}" target="_blank" class="footer-docs-button">{{name}}</a>
                    {{/footer.docsButtons}}
                </nav>
                
                <hr>

                <div class="footer-network">
                    <a class="footer-logo" href="{{footer.webcommerceUrl}}" target="_blank">
                        <img src="https://img.fertisystem.com.br/Marca_FertiSystem_PB-Negativo.png" alt="FertiSystem">
                    </a>
                    <p class="footer-copyright">{{footer.copyright}}</p>
                    <nav class="footer-network-buttons">
                        {{#footer.networkButtons}}
                            <a href="{{url}}" target="_blank">
                                <i class="{{icon}}"></i>
                            </a>
                        {{/footer.networkButtons}}
                    </nav>
                </div>
            </div>
        </script>
        <div id="footer-target" class="footer-section"></div>
    </footer>

    <!-- Loading overlay -->
    <div id="form-loading-overlay" class="form-loading-overlay" style="display: none;">
        <div class="form-loading-spinner">
            <div class="spinner"></div>
            <p id="form-loading-message"></p>
        </div>
    </div>

    <!-- Auth form -->
    <section>
        <script id="login-section-template" type="text/template">
            <form id="login-form" class="login-popup">
                <button id="exit-login-popup" type="button" class="close-container-button fs-button-cancel"></button>
                <h1>{{login-section.title}}</h1>
                <p id="auth-explanation">{{explanation}}</p>
                <div class="input-fields">
                    {{#login-section.email-input}}
                    <div class="email-field">
                        <label for="email">{{label}}</label>
                        <div class="input-container">
                            <input type="{{type}}" id="email" name="email" placeholder="{{placeholder}}" {{#isRequired}}required{{/isRequired}}>
                            <label for="email"><h3 class="email-status-message"></h3></label>
                        </div>
                    </div>
                    {{/login-section.email-input}}
                    {{#login-section.auth-input}}
                    <div class="auth-field">
                        <label for="{{id}}_1">{{label}}</label>
                        <div class="input-container">
                            <div class="otp-inputs">
                                <input autocomplete="one-time-code" inputmode="numeric" oninput="this.value = this.value.replace(/[^0-9]/g, '');" pattern="[0-9]*" type="{{type}}" id="{{id}}_1" name="{{id}}" placeholder="{{placeholder}}" {{#isRequired}}required{{/isRequired}}>
                                <input inputmode="numeric" oninput="this.value = this.value.replace(/[^0-9]/g, '');" pattern="[0-9]*" type="{{type}}" id="{{id}}_2" name="{{id}}" placeholder="{{placeholder}}" {{#isRequired}}required{{/isRequired}}>
                                <input inputmode="numeric" oninput="this.value = this.value.replace(/[^0-9]/g, '');" pattern="[0-9]*" type="{{type}}" id="{{id}}_3" name="{{id}}" placeholder="{{placeholder}}" {{#isRequired}}required{{/isRequired}}>
                                <input inputmode="numeric" oninput="this.value = this.value.replace(/[^0-9]/g, '');" pattern="[0-9]*" type="{{type}}" id="{{id}}_4" name="{{id}}" placeholder="{{placeholder}}" {{#isRequired}}required{{/isRequired}}>
                                <input inputmode="numeric" oninput="this.value = this.value.replace(/[^0-9]/g, '');" pattern="[0-9]*" type="{{type}}" id="{{id}}_5" name="{{id}}" placeholder="{{placeholder}}" {{#isRequired}}required{{/isRequired}}>
                                <input inputmode="numeric" oninput="this.value = this.value.replace(/[^0-9]/g, '');" pattern="[0-9]*" type="{{type}}" id="{{id}}_6" name="{{id}}" placeholder="{{placeholder}}" {{#isRequired}}required{{/isRequired}}>
                            </div>
                        </div>
                        <label for="{{id}}_1" class="note">{{{note}}}</label>
                    </div>
                </div>
                {{/login-section.auth-input}}
                <div id="form-errors-container" class="form-errors-container" style="display: none;"></div>
                <div class="submit-button-container">
                    <button type="button" id="submit-button">{{label}}</button>
                    <p id="submit-button-note">{{note}}</p>
                </div>
            </form>
        </script>
        <div id="login-section-target" class="popup-section"></div>
    </section>

    <!-- Loads all elements based on lang file -->
    <script src="scripts/load-page.js" type="module" defer></script>
</body>

</html>
