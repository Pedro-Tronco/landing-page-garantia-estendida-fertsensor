<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fert Sensor - Programa de Garantia</title>
    <link rel="icon" type="image/png" href="https://img.fertisystem.com.br/Icone_FertiSystem_PB-Negativo.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+1:wght@100..900&family=Nunito+Sans:ital,opsz,wght@0,6..12,200..1000;1,6..12,200..1000&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/mustache@4.2.0/mustache.js"></script>
</head>

<body>
    <nav class="navbar">
        <a href="index.html" class="nav-logo">
            <img src="https://img.fertisystem.com.br/Marca_FertiSystem_PB-Negativo.png" alt="FertiSystem">
        </a>

        <script id="nav-buttons-template" type="text/template">
            {{#nav.warranty.buttons}}
                <a href="{{navigation}}">{{name}}</a>
            {{/nav.warranty.buttons}}
        </script>
        <div id="nav-buttons-target" class="nav-buttons"></div>

        <div class="lang-dropdown">
            <script id="lang-toggle-template" type="text/template">
                {{#languages}}
                    <option value="{{code}}">{{label}}</option>
                {{/languages}}
            </script>
            <select id="lang-toggle" class="lang-selection"></select>
        </div>
    </nav>

    <main>
        <header>
            <script id="policy-header-template" type="text/template">
                <h2>{{policy-header.subtitle}}</h2>
                <h1>{{policy-header.title}}</h1>
                <p>{{policy-header.description}}</p>
                {{#policy-header.observation}}
                    <ul>
                        <li><strong>{{policy-header.observation.title}}</strong> {{{policy-header.observation.description}}}</li>
                    </ul>
                {{/policy-header.observation}}
            </script>
            <div id="policy-header-target" class="policy-header content-header"></div>
        </header>
        <section>
            <script id="policy-section-template" type="text/template">
                <div class="policy-document-container">
                    <h1>{{policy-section.document.title}}</h1>
                    <div class="pdf-container">
                        <object data="{{policy-section.document.apiEndpoint}}#toolbar=0&navpanes=0&scrollbar=1&view=FitH&zoom=page-width" type="application/pdf" class="pdf-viewer"> <!--  -->
                            <!-- Fallback content if the browser cannot display the embedded PDF -->
                            <div style="text-align: center; padding: 20px;">
                                <p>{{policy-section.document.fallbackMessage}}</p> 
                            </div>
                        </object>
                    </div>
                    <div style="text-align: center; margin: 20px;">
                        <a href="{{policy-section.document.apiEndpoint}}?download=true" download class="generic-button">{{policy-section.document.downloadMessage}}</a>
                    </div>
                </div>
                <h1 class="checkbox-message">{{policy-section.checkboxesMessage}}</h1>
                <form id="warranty-form">
                    <div class="checkbox-container">
                        {{#policy-section.checkboxes}}
                            <label>
                                <input type="checkbox" id="{{id}}">
                                {{message}}
                                {{#isRequired}} <span class="required-asterisk">*</span> {{/isRequired}}
                            </label>
                        {{/policy-section.checkboxes}}
                    </div>
                    <div class="inputs-container">
                        {{#policy-section.email-input}}
                        <div class="email-field">
                            <label for="email">{{label}} {{#isRequired}}<span class="required-asterisk">*</span>{{/isRequired}}</label>
                            <p>{{{explanation}}}</p>
                            <div class="input-container">
                                <input type="{{type}}" id="email" name="email" placeholder="{{placeholder}}" {{#isRequired}}required{{/isRequired}}>
                                <button type="button" id="send-email-otp"></button>
                                <h3 class="email-status-message"></h3>
                            </div>
                        </div>
                        {{/policy-section.email-input}}
                        {{#policy-section.auth-input}}
                        <div class="auth-field">
                            <label for="{{id}}">{{label}} {{#isRequired}}<span class="required-asterisk">*</span>{{/isRequired}}</label>
                            <p>{{{explanation}}}</p>
                            <div class="input-container">
                                <div class="otp-inputs">
                                    <input maxlength="1" inputmode="numeric" oninput="this.value = this.value.replace(/[^0-9]/g, '');" type="{{type}}" id="{{id}}_1" name="{{id}}" placeholder="{{placeholder}}" autocomplete="one-time-code" {{#isRequired}}required{{/isRequired}}>
                                    <input maxlength="1" inputmode="numeric" oninput="this.value = this.value.replace(/[^0-9]/g, '');" type="{{type}}" id="{{id}}_2" name="{{id}}" placeholder="{{placeholder}}" {{#isRequired}}required{{/isRequired}}>
                                    <input maxlength="1" inputmode="numeric" oninput="this.value = this.value.replace(/[^0-9]/g, '');" type="{{type}}" id="{{id}}_3" name="{{id}}" placeholder="{{placeholder}}" {{#isRequired}}required{{/isRequired}}>
                                    <input maxlength="1" inputmode="numeric" oninput="this.value = this.value.replace(/[^0-9]/g, '');" type="{{type}}" id="{{id}}_4" name="{{id}}" placeholder="{{placeholder}}" {{#isRequired}}required{{/isRequired}}>
                                    <input maxlength="1" inputmode="numeric" oninput="this.value = this.value.replace(/[^0-9]/g, '');" type="{{type}}" id="{{id}}_5" name="{{id}}" placeholder="{{placeholder}}" {{#isRequired}}required{{/isRequired}}>
                                    <input maxlength="1" inputmode="numeric" oninput="this.value = this.value.replace(/[^0-9]/g, '');" type="{{type}}" id="{{id}}_6" name="{{id}}" placeholder="{{placeholder}}" {{#isRequired}}required{{/isRequired}}>
                                </div>
                            </div>
                            {{#note}} <p class="note">{{{note}}}</p> {{/note}}
                        </div>
                        {{/policy-section.auth-input}}
                    </div>
                    <div id="form-errors-container" class="form-errors-container" style="display: none;"></div>
                    <label class="required-label">
                        <span class="required-asterisk">*</span> <p>{{policy-section.requiredLabel}} </p> 
                    </label>
                    <div class="submit-button-container">
                        <button type="button" id="submit-button">{{policy-section.subbmitButton.label}}</button>
                        <p>{{policy-section.subbmitButton.note}}</p>
                    </div>
                </form>
            </script>
            <div id="policy-section-target" class="policy-section"></div>
        </section>

    </main>

    <footer>
        <script id="footer-template" type="text/template">
            <div class="footer-container">
                <nav class="footer-docs carousel-fade-edges">
                    {{#footer.docsButtons}}
                        <a href="{{url}}" target="_blank" class="footer-docs-button">{{name}}</a>
                    {{/footer.docsButtons}}
                </nav>
                
                <hr>

                <div class="footer-network">
                    <a class="footer-logo" href="{{footer.webcommerceUrl}}" target="_blank">
                        <img src="https://img.fertisystem.com.br/Marca_FertiSystem_PB-Negativo.png" alt="FertiSystem">
                    </a>
                    <p class="footer-copyright">{{footer.copyright}}</p>
                    <nav class="footer-network-buttons">
                        {{#footer.networkButtons}}
                            <a href="{{url}}" target="_blank">
                                <i class="{{icon}}"></i>
                            </a>
                        {{/footer.networkButtons}}
                    </nav>
                </div>
            </div>
        </script>
        <div id="footer-target" class="footer-section"></div>
    </footer>

    <!-- Loading overlay -->
    <div id="form-loading-overlay" class="form-loading-overlay" style="display: none;">
        <div class="form-loading-spinner">
            <div class="spinner"></div>
            <p id="form-loading-message"></p>
        </div>
    </div>

    <!-- Loads all elements based on lang file -->
    <script src="scripts/load-page.js" type="module" defer></script>


</body>
